# 廊坊一中回忆录 · nginx 反向代理
# 放到 /etc/nginx/conf.d/memoir.conf，或 docker-compose 里挂到 /etc/nginx/conf.d/default.conf

# 简单限流：每个 IP 每秒最多 20 个请求（突发 40）
limit_req_zone $binary_remote_addr zone=memoir_req:10m rate=20r/s;

upstream memoir_app {
    server app:3000;          # 同机裸跑时改成 127.0.0.1:3000
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;            # 换成你的域名，例如 memoir.example.com

    # 申请 HTTPS 后取消下面两行注释（certbot 会自动改）
    # location /.well-known/acme-challenge/ { root /var/www/certbot; }
    # return 301 https://$host$request_uri;

    # 单个上传文件上限。取两者的较大值 + 余量：
    #   校友传文档 MAX_UPLOAD_MB（默认 500MB）
    #   站长后台导入 MAX_IMPORT_UPLOAD_MB（默认 2.5GB）
    # 这个值必须 >= 应用里的上限，否则大文件会在 nginx 层被 413 掉。
    client_max_body_size 2600m;
    # 2.5GB 在慢速上行下要传很久，超时给足（默认 60s 会中途掐断）
    client_body_timeout 600s;
    client_body_buffer_size 1m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # 静态资源交给 nginx 直出，省一趟 Node
    location /assets/ {
        root /usr/share/nginx/memoir;     # 见下方 volumes 说明；不挂载则删掉这两行
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri @app;
    }

    location @app {
        proxy_pass http://memoir_app;
    }

    location / {
        limit_req zone=memoir_req burst=40 nodelay;

        proxy_pass http://memoir_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "";
        proxy_read_timeout 1800s;
        proxy_send_timeout 1800s;
        proxy_request_buffering off;   # 大文件（后台导入最大 2.5GB）直接边收边转发，不先整个缓到 nginx
        proxy_buffering off;
    }
}

