# 一条命令起服务（含 nginx 反代）
#   cp .env.example .env && nano .env      # 改 SESSION_SECRET / ADMIN_PASSWORD
#   docker compose -f deploy/docker-compose.yml up -d --build
#
# 数据落在具名卷 memoir-data / memoir-uploads 里，容器重建不丢。

services:
  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: langfang-memoir:latest
    container_name: memoir
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      NODE_ENV: production
      PORT: 3000
      TRUST_PROXY: 1            # 走 nginx 反代，需信任 X-Forwarded-For
    volumes:
      - memoir-data:/app/data
      - memoir-uploads:/app/uploads
    expose:
      - 3000
    # 不想用 nginx 的话，把下面两行的注释去掉，直接开 3000 端口
    # ports:
    #   - "3000:3000"
    networks:
      - memoir
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

  nginx:
    image: nginx:alpine
    container_name: memoir-nginx
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # 申请 HTTPS 证书后取消注释，并把证书文件放进 deploy/certs/
      # - ./certs:/etc/nginx/certs:ro
    networks:
      - memoir

volumes:
  memoir-data:
  memoir-uploads:

networks:
  memoir: